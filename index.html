<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="조선의 코끼리, 닌텐도의 놀이, 블루투스의 룬을 읽는 세 가지 매거진 시안.">
  <title>별별잡학 편집실</title>
  <link rel="stylesheet" href="style.css">

<body class="index-page">
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="masthead">
    <a class="brand" href="index.html">별별잡학<span>편집실</span></a>
    <a class="index-link" href="#stories">시안 보기 <span aria-hidden="true">↓</span></a>
  </header>

  <main id="main" class="catalog" tabindex="-1">
    <header class="catalog-intro">
      <h1>오늘의 <em>잡학</em></h1>
    </header>
    <ul class="story-grid" id="stories">
      <li>
        <a class="story-card theme-elephant" href="elephant.html">
          <div class="card-art">
            <img src="assets/elephant.jpg" alt="" width="800" height="1200">
            <img class="card-cut" src="assets/elephant-eye.jpg" alt="" width="1280" height="934">
          </div>
          <div class="card-copy">
            <h2>조선에서 귀양 간 코끼리</h2>
            <p>태종은 일본에서 받은 코끼리를 전라도의 섬으로 보냈다.</p>
            <span class="card-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      </li>
      <li>
        <a class="story-card theme-nintendo" href="nintendo.html">
          <div class="card-art">
            <img src="assets/nin-famicom.webp" alt="" width="1163" height="527">
            <img class="card-cut" src="assets/nin-game-boy.webp" alt="" width="875" height="1064">
          </div>
          <div class="card-copy">
            <h2>닌텐도가 만들어 온 놀이</h2>
            <p>마리오를 만든 회사는 교토의 화투 가게에서 시작했다.</p>
            <span class="card-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      </li>
      <li>
        <a class="story-card theme-bluetooth" href="bluetooth.html">

            <img src="assets/bt-thinkpad.jpg" alt="" width="1500" height="1125">
            <img class="card-cut" src="assets/bt-harald.jpg" alt="" width="960" height="1304">
          </div>
          <div class="card-copy">
            <h2>블루투스가 빌린 이름</h2>
            <p>이어폰을 연결할 때 보는 아이콘에는 덴마크 왕의 이니셜이 숨어 있다.</p>
            <span class="card-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      </li>
    </ul>
